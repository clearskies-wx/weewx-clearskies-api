[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "weewx-clearskies-api"
version = "1.0.0b1"
description = "HTTP/JSON API for the Clear Skies weather dashboard"
license = { text = "PolyForm-Noncommercial-1.0.0" }
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Clear Skies contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # I18N T3.1: Babel for locale-aware number formatting (decimal separators
    # per locale, e.g. "22,5" in de-DE vs "22.5" in en-US).
    "babel==2.18.0",
    "fastapi==0.136.1",
    "python-multipart>=0.0.7",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "configobj==5.0.9",
    "cachetools==5.5.2",
    # ADR-012: SQLAlchemy 2.x engine; pymysql for MariaDB/MySQL (pure-Python,
    # no native build required — see db/engine.py for driver-choice rationale).
    "sqlalchemy==2.0.49",
    "pymysql==1.1.3",
    # ADR-014: Skyfield for almanac ephemeris computation (pre-approved 2026-05-06).
    "skyfield>=1.48",
    # ADR-072: pvlib for McClear clear-sky GHI (bootstrap calibration).
    "pvlib>=0.15.0",
    # ADR-038 / 3b-1: httpx for provider HTTP (sync mode; respx is its mock lib).
    # Pre-approved 2026-05-07 per task brief §confirmed-call #1.
    "httpx>=0.28.1",
    # ADR-017 / 3b-1: redis-py for the Redis cache backend.
    # Always installed so operators who set CLEARSKIES_CACHE_URL get a working
    # backend without a separate install step (ADR-017 §Decision).
    # Pre-approved 2026-05-07 per task brief §confirmed-call #4.
    "redis>=5.0.0",
    # 3b-14: defusedxml for WMS GetCapabilities XML parsing (radar domain).
    # Per coding.md §1 "Avoid dangerous functions": stdlib xml.etree is vulnerable
    # to billion-laughs, external-entity-expansion, and quadratic-blowup attacks.
    # defusedxml is a pure-Python MIT-licensed replacement that disables these
    # attack vectors. Lead call 1 in 3b-14 brief.
    "defusedxml==0.7.1",
    # ADR-038: TLS by default for all connections. cryptography provides
    # Ed25519 key generation and X.509 self-signed cert creation for first-start
    # auto-TLS (operator can supply their own cert via --tls-cert / --tls-key).
    "cryptography>=43.0.0",
    # ADR-031: Prometheus metrics endpoint on health port (opt-in via
    # CLEARSKIES_METRICS_ENABLED=true). prometheus-client is a pure-Python
    # library; no native build required.
    "prometheus-client==0.25.0",
    # ADR-058: sse-starlette provides EventSourceResponse for the /sse endpoint
    # that streams weewx loop packets to dashboard clients.
    "sse-starlette>=2.0.0",
    # ADR-079: scikit-learn for forecast correction Random Forest model.
    "scikit-learn>=1.5.0",
    # Phase 4A T4A.2/T4A.2b: scipy.interpolate.PchipInterpolator for
    # variable-resolution bathymetric profile interpolation
    # (enrichment/bathymetry.py), scipy.special.ellipj/ellipk for cnoidal
    # wave shape computation (services/surf_1d_analytical.py). Previously
    # only present transitively via scikit-learn's own scipy dependency —
    # pinned explicitly per rules/coding.md §1 "Pin dependency versions"
    # (a lockfile alone does not satisfy that rule). Pinned at the version
    # uv.lock already resolves.
    "scipy==1.18.0",
    # T8.2: PyYAML for loading operator-editable reference data (currently
    # data/species.yaml, enrichment/fishing_species.py) via yaml.safe_load()
    # at import time. Previously only present transitively (e.g. via
    # uvicorn[standard]); pinned explicitly so import-time data loading
    # doesn't depend on another package's dependency graph.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
marine = [
    # ADR-085: eccodes Python binding for GRIB2 processing (marine GRIB2 data).
    # Requires the eccodes C library to be installed on the system first
    # (apt install libeccodes-dev / dnf install eccodes-devel / brew install eccodes).
    # Docker images include it by default; native installs need the system library.
    "eccodes>=1.5",
    # ADR-091: OFS ocean data via THREDDS/OPeNDAP (xarray + netCDF4).
    "xarray>=2024.1",
    "netCDF4>=1.6",
]
nearshore = [
    # T2.1 (ADR-093): SWAN+TruShore nearshore wave model dependencies.
    # [nearshore] depends on [marine] — pulls in eccodes (GRIB2 C library),
    # xarray, and netCDF4. Install the [marine] system prerequisites before
    # this extra (libeccodes-dev / eccodes-devel / brew install eccodes).
    "weewx-clearskies-api[marine]",
    # cfgrib: reads GRIB2 files via the eccodes C library. Used for HRRR
    # wind field ingest in providers/wind/hrrr.py. Lighter alternative to
    # raw eccodes Python bindings for structured variable access.
    # Requires the eccodes system library — already required by [marine].
    "cfgrib>=0.9.10",
    # xarray: n-dimensional labelled array handling for HRRR grid operations
    # (interpolation, slicing, coordinate transforms). Already pulled in by
    # [marine]; listed explicitly here so [nearshore] remains self-documenting
    # when installed without [marine] in a future split scenario.
    "xarray>=2024.1",
    # shapely: computational geometry for GSFM shelf boundary queries
    # (nearest-point-on-polyline) used in domain sizing (Phase 13/14).
    "shapely>=2.0",
    # coastalmodeling-vdatum: NOAA Ocean Modeling vertical datum conversion
    # using official VDatum separation GeoTIFF grids via PROJ.  Converts
    # between NAVD88/MLLW/MHW/MHHW/IGLD85 and LMSL (local MSL) for
    # bathymetry datum normalization.  US coastal coverage only — international
    # operators supply manual MSL offsets.
    "coastalmodeling-vdatum>=0.1",
    # ---------------------------------------------------------------------------
    # SWAN binary — NOT a pip package; must be installed separately.
    # SWAN 41.45 (Simulating WAves Nearshore, Delft University of Technology)
    # is a compiled Fortran binary. It is the computational core of TruShore.
    #
    # Prerequisites (Debian/Ubuntu):
    #   sudo apt install gfortran libopenmpi-dev
    #
    # Installation:
    #   sudo bash scripts/install_swan.sh
    #
    # This script downloads SWAN 41.45 from SourceForge, compiles with
    # gfortran + OpenMP, and installs the binary to /usr/local/bin/swan.
    #
    # Without SWAN on PATH, the API logs CRITICAL at startup and the surf
    # endpoint returns null surf data (no fallback model). See T2.2.
    # ---------------------------------------------------------------------------
]
dev = [
    "ruff==0.11.9",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    # Integration tests: pytest-timeout guards against DB fixture hangs
    "pytest-timeout==2.3.1",
    # 3b round 1: respx mocks outbound httpx calls (no live network in CI per ADR-038).
    # fakeredis provides an in-process Redis fake for RedisCache unit tests (ADR-017).
    # httpx is a runtime dep (>=0.28.1); respx needs it pinned exactly for compat.
    "httpx==0.28.1",
    "respx==0.22.0",
    "fakeredis==2.26.2",
    # ADR-033: pytest-benchmark for API endpoint latency measurement.
    # Benchmarks run on weather-dev with a real database; excluded from CI.
    "pytest-benchmark==5.1.0",
]

[project.urls]
Homepage = "https://github.com/clearskies-wx"
Repository = "https://github.com/clearskies-wx/weewx-clearskies-api"
Changelog = "https://github.com/clearskies-wx/weewx-clearskies-api/blob/main/CHANGELOG.md"

[project.scripts]
weewx-clearskies-api = "weewx_clearskies_api.__main__:main"
clearskies-migrate-charts = "weewx_clearskies_api.tools.migrate_charts:main"

[tool.hatch.build.targets.wheel]
packages = ["weewx_clearskies_api"]

# ---------------------------------------------------------------------------
# ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Rule sets per task brief: E, F, W, I, B, S (security), N (naming), UP, SIM
select = ["E", "F", "W", "I", "B", "S", "N", "UP", "SIM"]
ignore = [
    # S101: assert used — allowed in tests; we'll per-file ignore in test files
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.extend-per-file-ignores]
# Enforce no f-string SQL — regex pattern ban on f-strings inside db/ module.
# Real enforcement is via S608 (SQL injection) + the grep gate in CI.
# The ruff S608 rule fires on string-formatted SQL; flagging it here
# ensures the CI ruff pass catches it before it reaches review.
"weewx_clearskies_api/db/**/*.py" = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict mode per coding.md §2
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["configobj.*", "cachetools.*"]
ignore_missing_stubs = true

[[tool.mypy.overrides]]
# SQLAlchemy ships its own type stubs (sqlalchemy-stubs is bundled since 2.x).
# pymysql does not ship stubs — ignore missing stubs for it only.
module = ["pymysql.*"]
ignore_missing_stubs = true

[[tool.mypy.overrides]]
# skyfield does not ship type stubs.
module = ["skyfield.*"]
ignore_missing_stubs = true

[[tool.mypy.overrides]]
# defusedxml does not ship type stubs (3b-14).
module = ["defusedxml.*"]
ignore_missing_stubs = true

[[tool.mypy.overrides]]
# prometheus-client does not ship PEP 561 type stubs (ADR-031).
module = ["prometheus_client.*"]
ignore_missing_stubs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = false
markers = [
    "integration: marks integration tests that require the dev/test stack (MariaDB or seeded SQLite)",
    "live_network: marks tests that require live network access",
    "redis: marks integration tests that require the redis compose profile (use with -m 'integration and redis')",
    "benchmark: marks benchmark tests for endpoint performance measurement (ADR-033)",
]
