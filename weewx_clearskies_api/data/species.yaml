  # ---------------------------------------------------------------------
  # T8.3 (2026-07-12): pacific_sw (SoCal) species added below. Temperature
  # data sourced from FishBase preferred-temperature-range figures (derived
  # from occurrence-weighted AquaMaps cells), CDFW Marine Species Portal
  # enhanced status reports, and NOAA/academic tagging studies as cited per
  # species. Where only a survival/tolerance range was available, optimal
  # and good bands were narrowed inward per the guidance in this file's
  # schema doc (optimal ~ middle 40%, good ~ middle 70% of the cited band).
  # ---------------------------------------------------------------------
  california halibut:
    # Source: thetackleroom.com SoCal halibut guide (55-68F preferred,
    # deeper/cooler in summer) + fishing catch-per-unit-effort analysis
    # (spearfactor.com) showing peak CPUE at 61F.
    pressure_sensitivity: 0.55
    temp_optimal: [58.0, 66.0]
    temp_good: [55.0, 72.0]
    temp_marginal: [50.0, 78.0]
    tide_preference: outgoing
    tide_multiplier: 1.2
    time_preference: dawn
    time_multiplier: 1.2
  california sheephead:
    # Source: FishBase (Semicossyphus pulcher) preferred temperature
    # 16.6-22.9C (62-73F), mean 21.2C (70F), based on 30 cells.
    # Distinct from Atlantic sheepshead (Archosargus probatocephalus).
    # Wrasse family — rocky reef/kelp bed dweller, diurnal feeder.
    pressure_sensitivity: 0.3
    temp_optimal: [64.0, 72.0]
    temp_good: [60.0, 75.0]
    temp_marginal: [55.0, 80.0]
    tide_preference: incoming
    tide_multiplier: 1.1
    time_preference: dawn
    time_multiplier: 1.2
  opaleye:
    # Source: FishBase (Girella nigricans) sea temperature tolerance 0-33C
    # (32-91F); optimal/good bands narrowed inward per schema guidance
    # since only the outer tolerance band was found (herbivorous
    # rocky-reef/kelp grazer, common in SoCal tide pools).
    pressure_sensitivity: 0.5
    temp_optimal: [55.0, 72.0]
    temp_good: [48.0, 78.0]
    temp_marginal: [40.0, 85.0]
    tide_preference: any
    tide_multiplier: 1.0
    time_preference: any
    time_multiplier: 1.0
  kelp bass:
    # Also known as calico bass. Source: co-occurring barred sand bass
    # FishBase preferred-temp data (same SoCal kelp/rock habitat) plus
    # SoCal fishing-guide consensus (AFTCO, SWBA) that calico activity
    # picks up as water warms into the 60s and holds through the 70s.
    pressure_sensitivity: 0.35
    temp_optimal: [62.0, 72.0]
    temp_good: [56.0, 76.0]
    temp_marginal: [50.0, 80.0]
    tide_preference: incoming
    tide_multiplier: 1.15
    time_preference: dawn
    time_multiplier: 1.2
  sand bass:
    # Barred sand bass. Source: FishBase preferred temperature range
    # 19.4-26C, mean 22.3C (67-79F, mean 72F).
    pressure_sensitivity: 0.35
    temp_optimal: [69.0, 76.0]
    temp_good: [64.0, 79.0]
    temp_marginal: [58.0, 84.0]
    tide_preference: outgoing
    tide_multiplier: 1.15
    time_preference: dusk
    time_multiplier: 1.2
  white seabass:
    # Source: NOAA/SPO seasonal movement & temperature profile study
    # (Aalbers) — preferred 58-68F, >50% of time in 55-61F gradient,
    # broader tolerance 46-75F.
    pressure_sensitivity: 0.7
    temp_optimal: [58.0, 66.0]
    temp_good: [50.0, 70.0]
    temp_marginal: [46.0, 75.0]
    tide_preference: incoming
    tide_multiplier: 1.2
    time_preference: dusk
    time_multiplier: 1.3
  california barracuda:
    # Also known as Pacific barracuda. Source: CDFW Marine Species Portal
    # (59-73F preferred, arrival threshold ~62F) + spearfactor.com summer
    # gamefish guide (60-72F).
    pressure_sensitivity: 0.3
    temp_optimal: [64.0, 72.0]
    temp_good: [59.0, 75.0]
    temp_marginal: [55.0, 80.0]
    tide_preference: any
    tide_multiplier: 1.0
    time_preference: dawn
    time_multiplier: 1.15
  pacific mackerel:
    # Source: FishBase preferred temperature range 9.3-27.7C mean 20.7C,
    # cross-checked against fishing-guide consensus of 50-72F/60-72F;
    # spawning occurs 15-20C (59-68F).
    pressure_sensitivity: 0.2
    temp_optimal: [60.0, 72.0]
    temp_good: [54.0, 78.0]
    temp_marginal: [49.0, 82.0]
    tide_preference: any
    tide_multiplier: 1.0
    time_preference: any
    time_multiplier: 1.0
  pacific bonito:
    # Source: FishBase preferred temperature range (Sarda chiliensis)
    # 14.6-23.1C, mean 18.5C (58-74F, mean 65F).
    pressure_sensitivity: 0.15
    temp_optimal: [62.0, 70.0]
    temp_good: [56.0, 75.0]
    temp_marginal: [50.0, 80.0]
    tide_preference: any
    tide_multiplier: 1.0
    time_preference: dawn
    time_multiplier: 1.15
  white croaker:
    # Source: FishBase preferred temperature range (Genyonemus lineatus)
    # 7.7-18.1C, mean 10.7C (46-65F, mean 51F); year-round SoCal bay
    # resident over sand/mud bottoms.
    pressure_sensitivity: 0.65
    temp_optimal: [46.0, 58.0]
    temp_good: [42.0, 62.0]
    temp_marginal: [38.0, 66.0]
    tide_preference: outgoing
    tide_multiplier: 1.15
    time_preference: any
    time_multiplier: 1.0
  leopard shark:
    # Source: Shark Research Institute (55-70F preferred) + CDFW range
    # extension study (Tomales Bay/SF Bay 10-16C ideal, migrates south
    # below 10-12C/50-54F).
    pressure_sensitivity: 0.15
    temp_optimal: [57.0, 65.0]
    temp_good: [52.0, 70.0]
    temp_marginal: [46.0, 75.0]
    tide_preference: incoming
    tide_multiplier: 1.2
    time_preference: dusk
    time_multiplier: 1.2
  thresher shark:
    # Source: PMC archival tagging study of subadult/adult common thresher
    # off SoCal (SST range 16-21C observed) + FishBase preferred temp
