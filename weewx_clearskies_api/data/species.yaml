seasonal_behavior:
  redfish:
    9:
      pre_spawn_multiplier: 1.5
    10:
      spawning_multiplier: 2.5
  striped bass:
    4:
      pre_spawn_multiplier: 1.5
    5:
      spawning_multiplier: 3.0
  flounder:
    10:
      pre_spawn_multiplier: 1.5
    11:
      spawning_multiplier: 2.0
  snook:
    # Regulatory closure (FL Atlantic/Gulf summer closed season) — score 0
    # regardless of environmental conditions.
    6:
      closed: true
    7:
      closed: true
    8:
      closed: true
  king mackerel:
    # Migration windows treated as activity boosts via the same
    # spawning_multiplier field (schema has no dedicated "migration" field;
    # reused here for the southward fall run and northward spring run).
    4:
      spawning_multiplier: 1.5
    5:
      spawning_multiplier: 1.5
    10:
      spawning_multiplier: 1.5
    11:
      spawning_multiplier: 1.5
  salmon:
