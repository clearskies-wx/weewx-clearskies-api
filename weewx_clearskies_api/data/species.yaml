# Species reference data for the Clear Skies fishing scorer
# (API-MANUAL.md §17 "Fishing scorer").
#
# Loaded once at process start by
# weewx_clearskies_api/enrichment/fishing_species.py via
# _load_species_data(). The module's public API
# (BIOGEOGRAPHIC_REGIONS, SPECIES_BY_REGION, SPECIES_PROFILES,
# SEASONAL_BEHAVIOR, classify_region()) is unchanged by this externalization
# (T8.2) — only the storage location moved from hardcoded Python dicts to
# this operator-editable file. A future config override
# (api.conf [fishing] species_data_path) will let operators point the loader
# at their own file instead of this bundled default; not implemented yet —
# see fishing_species.py's module docstring.
#
# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#
# regions: dict[region_name -> bbox]
#   Coarse lat/lon bounding boxes used by classify_region() to map a
#   (lat, lon) coordinate to one of the 11 US biogeographic regions.
#     lat_min, lat_max: float, degrees (-90..90)
#     lon_min, lon_max: float, degrees (-180..180)
#   A region whose lon_min > lon_max is a wraparound box crossing the
#   antimeridian (currently only pacific_territories: Guam/CNMI side
#   lon_min=144.0, American Samoa side lon_max=-172.0).
#
#   Example:
#     atlantic_ne:
#       lat_min: 41.0
#       lat_max: 47.0
#       lon_min: -74.0
#       lon_max: -66.0
#
# species_by_region: dict[region_name -> dict[target_category -> list[str]]]
#   target_category is one of: saltwater_inshore, bottom_fish,
#   freshwater_sport, salmonids (config/marine_config.py
#   FishingSpotConfig._VALID_TARGET_CATEGORIES). Descriptive metadata used to
#   auto-populate a fishing spot's species config list from its
#   biogeographic region and target category. Not every species listed here
#   has a species_profiles entry below — the scorer falls back to a neutral
#   default profile for species with no profile
#   (fishing_scorer._DEFAULT_SPECIES_PROFILE). Not all categories apply to
#   all regions (e.g. Hawaii has no freshwater_sport).
#
#   Example:
#     atlantic_ne:
#       saltwater_inshore:
#         - striped bass
#         - bluefish
#         - flounder
#
# species_profiles: dict[species_name -> profile]
#   Per-species scoring inputs consumed by fishing_scorer.py. Species names
#   are lowercase and matched case-insensitively by the scorer.
#     pressure_sensitivity: float, 0.0-1.0 (0.1 = little/no swim bladder,
#       e.g. tuna; 0.8 = large swim bladder, e.g. redfish — higher means
#       more sensitive to barometric pressure changes)
#     temp_optimal: [min, max] degrees Fahrenheit
#     temp_good:    [min, max] degrees Fahrenheit (superset of temp_optimal)
#     temp_marginal:[min, max] degrees Fahrenheit (superset of temp_good)
#       Ranges are nested so a water temperature reading falls into exactly
#       one bucket when checked in optimal -> good -> marginal -> outside
#       order; outside temp_marginal scores as "inactive".
#     tide_preference: "incoming" | "outgoing" | "slack" | "any"
#     tide_multiplier: float, applied to the species score when the current
#       tide_state matches tide_preference ("slack" matches both
#       slack_high and slack_low)
#     time_preference: "dawn" | "dusk" | "night" | "any"
#     time_multiplier: float, applied when the current time-of-day bucket
#       matches time_preference
#
#   Example:
#     redfish:
#       pressure_sensitivity: 0.8
#       temp_optimal: [68.0, 80.0]
#       temp_good: [60.0, 85.0]
#       temp_marginal: [50.0, 90.0]
#       tide_preference: outgoing
#       tide_multiplier: 1.2
#       time_preference: dawn
#       time_multiplier: 1.3
#
# seasonal_behavior: dict[species_name -> dict[month(1-12) -> entry]]
#   entry fields (all optional; any subset may be set for a given
#   species/month pair):
#     spawning_multiplier: float, applied during peak spawning activity
#       (typically 2.0-3.0x)
#     pre_spawn_multiplier: float, applied during the pre-spawn buildup
#       (typically ~1.5x)
#     closed: bool, true = regulatory closure — the species' score is forced
#       to 0 for that month regardless of environmental conditions
#   Months not listed for a species carry no seasonal adjustment (implicit
#   multiplier 1.0, not closed).
#
#   Example:
#     redfish:
#       9:
#         pre_spawn_multiplier: 1.5
#       10:
#         spawning_multiplier: 2.5
#
# All temperature ranges are in degrees Fahrenheit.
# ---------------------------------------------------------------------------

